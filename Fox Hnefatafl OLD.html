<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Лисёнок и двери</title>
  <style>
    body {
      background: #05060a;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding-top: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    #info {
      margin-bottom: 10px;
      font-size: 13px;
      text-align: center;
      max-width: 480px;
    }
    #status {
      margin-bottom: 10px;
      min-height: 20px;
      font-size: 14px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(7, 40px);
      gap: 2px;
      background: #111;
      padding: 6px;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }
    .cell {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
    }
    .cell.exit-left {
      background: linear-gradient(to right, #2f5, #222);
    }
    .cell.exit-right {
      background: linear-gradient(to left, #2f5, #222);
    }
    .fox {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #ffa94d, #cc6b1e);
      box-shadow: 0 0 8px rgba(255,169,77,0.7);
    }
    .enemy {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: radial-gradient(circle at 30% 20%, #ff4d4d, #7a1010);
      box-shadow: 0 0 8px rgba(255,77,77,0.7);
    }
    .wall {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: #444;
    }
    #hint {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Лисёнок и две двери</h1>
  <div id="info">
    Проведи лисёнка к левой или правой двери. Игра следит за тем, куда ты «тяготеешь»,
    и стягивает врагов в эту сторону. Используй ложные манёвры, чтобы обмануть её.
  </div>
  <div id="status"></div>
  <div class="board" id="board"></div>
  <div id="hint">Управление: стрелки ← ↑ → ↓</div>

  <script>
    const cols = 9;
    const rows = 7;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');

    const CELL_EMPTY = 0;
    const CELL_FOX = 1;
    const CELL_ENEMY = 2;
    const CELL_EXIT_LEFT = 3;
    const CELL_EXIT_RIGHT = 4;
    const CELL_WALL = 5;

    let grid = [];
    let fox = { x: 4, y: 3 }; // центр
    let bias = 0;
    let moveHistory = [];
    const biasWindow = 5;
    const biasThreshold = 2;

    function initGrid() {
      grid = [];
      for (let y = 0; y < rows; y++) {
        const row = [];
        for (let x = 0; x < cols; x++) {
          row.push(CELL_EMPTY);
        }
        grid.push(row);
      }

      fox = { x: 4, y: 3 };
      grid[fox.y][fox.x] = CELL_FOX;

      grid[3][0] = CELL_EXIT_LEFT;
      grid[3][cols - 1] = CELL_EXIT_RIGHT;

      for (let y = 1; y < rows - 1; y++) {
        if (y === 3) continue;
        grid[y][4] = CELL_WALL;
      }

      // РОВНО 4 врага
      const enemyPositions = [
        { x: 2, y: 2 },
        { x: 6, y: 2 },
        { x: 2, y: 4 },
        { x: 6, y: 4 }
      ];
      enemyPositions.forEach(p => grid[p.y][p.x] = CELL_ENEMY);

      bias = 0;
      moveHistory = [];
      render();
      statusEl.textContent = 'Выбери путь: к левой или правой двери.';
    }

    function render() {
      boardEl.innerHTML = '';
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';

          const v = grid[y][x];
          if (v === CELL_EXIT_LEFT) cellEl.classList.add('exit-left');
          if (v === CELL_EXIT_RIGHT) cellEl.classList.add('exit-right');

          if (v === CELL_FOX) {
            const foxEl = document.createElement('div');
            foxEl.className = 'fox';
            cellEl.appendChild(foxEl);
          } else if (v === CELL_ENEMY) {
            const eEl = document.createElement('div');
            eEl.className = 'enemy';
            cellEl.appendChild(eEl);
          } else if (v === CELL_WALL) {
            const wEl = document.createElement('div');
            wEl.className = 'wall';
            cellEl.appendChild(wEl);
          }

          boardEl.appendChild(cellEl);
        }
      }
    }

    function inBounds(x, y) {
      return x >= 0 && x < cols && y >= 0 && y < rows;
    }

    function tryMoveFox(dx, dy) {
      const nx = fox.x + dx;
      const ny = fox.y + dy;
      if (!inBounds(nx, ny)) return;

      const target = grid[ny][nx];
      if (target === CELL_WALL || target === CELL_ENEMY) {
        statusEl.textContent = 'Лисёнок не может пройти здесь.';
        return;
      }

      if (dx !== 0) {
        moveHistory.push(dx);
        if (moveHistory.length > biasWindow) moveHistory.shift();
        updateBias();
      }

      grid[fox.y][fox.x] = CELL_EMPTY;
      fox.x = nx;
      fox.y = ny;

      if (target === CELL_EXIT_LEFT) {
        grid[fox.y][fox.x] = CELL_FOX;
        render();
        statusEl.textContent = 'Ты открыл левую дверь.';
        window.removeEventListener('keydown', handleKey);
        return;
      }
      if (target === CELL_EXIT_RIGHT) {
        grid[fox.y][fox.x] = CELL_FOX;
        render();
        statusEl.textContent = 'Ты открыл правую дверь.';
        window.removeEventListener('keydown', handleKey);
        return;
      }

      grid[fox.y][fox.x] = CELL_FOX;

      gameReact();
      render();
    }

    function updateBias() {
      let sum = 0;
      for (const d of moveHistory) sum += d;
      bias = sum;
    }

    function getEnemies() {
      const enemies = [];
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x] === CELL_ENEMY) enemies.push({ x, y });
        }
      }
      return enemies;
    }

    function gameReact() {
      if (bias <= -biasThreshold) {
        statusEl.textContent = 'Игра тянет врагов влево.';
        pullEnemies('left');
      } else if (bias >= biasThreshold) {
        statusEl.textContent = 'Игра тянет врагов вправо.';
        pullEnemies('right');
      } else {
        moveEnemiesTowardsFox();
      }
    }

    function pullEnemies(side) {
      const enemies = getEnemies();

      enemies.forEach(e => grid[e.y][e.x] = CELL_EMPTY);

      enemies.forEach(e => {
        let nx = e.x;
        if (side === 'left' && e.x > 1) nx = e.x - 1;
        if (side === 'right' && e.x < cols - 2) nx = e.x + 1;

        if (grid[e.y][nx] === CELL_EMPTY) {
          grid[e.y][nx] = CELL_ENEMY;
        } else {
          grid[e.y][e.x] = CELL_ENEMY;
        }
      });
    }

    function moveEnemiesTowardsFox() {
      const enemies = getEnemies();
      enemies.forEach(e => grid[e.y][e.x] = CELL_EMPTY);

      enemies.forEach(e => {
        let bestX = e.x;
        let bestY = e.y;

        if (fox.x < e.x) bestX = e.x - 1;
        else if (fox.x > e.x) bestX = e.x + 1;

        if (fox.y < e.y) bestY = e.y - 1;
        else if (fox.y > e.y) bestY = e.y + 1;

        if (inBounds(bestX, bestY) &&
            grid[bestY][bestX] === CELL_EMPTY &&
            !(bestX === fox.x && bestY === fox.y)) {
          grid[bestY][bestX] = CELL_ENEMY;
        } else {
          grid[e.y][e.x] = CELL_ENEMY;
        }
      });
    }

    function handleKey(e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); tryMoveFox(-1, 0); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); tryMoveFox(1, 0); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); tryMoveFox(0, -1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); tryMoveFox(0, 1); }
    }

    window.addEventListener('keydown', handleKey);
    initGrid();
  </script>
</body>
</html>
