<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>The Labyrinth</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap');

:root {
  --black:#050505; --yellow:#f5c842; --yellow-dim:#c8962a;
  --red:#c0392b; --red-glow:rgba(192,57,43,0.4);
  --green:#27ae60; --green-glow:rgba(39,174,96,0.4);
  --wall-edge:#2e1e1e; --fog:#050505;
  --text:#b09880; --text-bright:#e0c8a0;
  --naive-col:#27ae60; --naive-glow:rgba(39,174,96,0.35);
  --cynic-col:#c0392b; --cynic-glow:rgba(192,57,43,0.35);
  --purple:#cc44ff; --purple-glow:rgba(204,68,255,0.5);
  --cs:58px;
  --cols:13;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--black);color:var(--text-bright);
  font-family:'IM Fell English',serif;overflow:hidden;user-select:none;}

body::before{content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
  pointer-events:none;z-index:300;}

/* ═══════════════════════════════════════════
   MAZE ROOT
═══════════════════════════════════════════ */
#maze-root{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:var(--black);
}
#maze-title-bar{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.5em;
  color:var(--text-bright);text-transform:uppercase;opacity:0.7;
}

/* HUD */
#hud{display:flex;justify-content:space-between;align-items:center;
  width:calc(var(--cs)*var(--cols));gap:10px;}
.hud-candle{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:0.1em;}
.candle-dot{width:8px;height:8px;border-radius:50%;}
.candle-dot.red{background:var(--red);box-shadow:0 0 6px var(--red);}
.candle-dot.green{background:var(--green);box-shadow:0 0 6px var(--green);}
.hud-candle.red{color:#e05050;}
.hud-candle.green{color:#40c070;}
#steps-counter{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.3em;color:var(--text-bright);opacity:0.8;}
#candle-status{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.18em;color:#e8c060;opacity:0.9;min-width:120px;text-align:center;}
#candle-status.out{color:#aa6633;}
#thread-counter{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.2em;
  color:var(--purple);opacity:0.9;min-width:120px;text-align:center;}
#thread-counter.inactive{color:#553366;opacity:0.4;}

/* Game container */
#game-container{position:relative;
  width:calc(var(--cs)*var(--cols));
  height:calc(var(--cs)*9);}
#grid{display:grid;
  grid-template-columns:repeat(var(--cols),var(--cs));
  grid-template-rows:repeat(9,var(--cs));
  width:100%;height:100%;}
#thread-canvas{position:absolute;inset:0;pointer-events:none;z-index:6;}

/* Cells */
.cell{position:relative;width:var(--cs);height:var(--cs);background:var(--black);
  transition:background 0.28s ease,box-shadow 0.28s ease;}
.corridor{position:absolute;inset:0;background:var(--black);
  transition:background 0.28s ease,border-color 0.12s ease;}
.wall-n{border-top:3px solid var(--wall-edge);}
.wall-s{border-bottom:3px solid var(--wall-edge);}
.wall-w{border-left:3px solid var(--wall-edge);}
.wall-e{border-right:3px solid var(--wall-edge);}
.cell.dark{background:var(--fog)!important;box-shadow:none!important;}
.cell.dark .corridor{background:var(--fog);border-color:var(--fog)!important;}
.cell.lit{background:#0e0c09;}.cell.lit .corridor{background:#0e0c09;}
.cell.player-cell{background:#181208!important;box-shadow:inset 0 0 28px rgba(245,200,66,0.18)!important;}
.cell.exit-left{box-shadow:inset 0 0 22px var(--red-glow),0 0 16px var(--red-glow)!important;}
.cell.exit-right{box-shadow:inset 0 0 22px var(--green-glow),0 0 16px var(--green-glow)!important;}
.cell.static-lit{box-shadow:inset 0 0 16px rgba(245,200,66,0.12)!important;}
.cell.spool-glow{box-shadow:inset 0 0 22px rgba(204,68,255,0.4),0 0 14px rgba(204,68,255,0.3)!important;}

/* Candles */
.static-candle{position:absolute;width:8px;height:8px;border-radius:50%;
  transform:translate(-50%,-50%);top:50%;left:50%;pointer-events:none;z-index:7;}
.static-candle.unlit{background:#251a0d;box-shadow:0 0 2px 1px rgba(40,20,5,0.5);}
.static-candle.lit-yellow{background:radial-gradient(circle,#ffe090,var(--yellow));
  box-shadow:0 0 5px 2px rgba(245,200,66,0.75),0 0 14px 5px rgba(245,200,66,0.28);
  animation:flicker-y 2.2s ease-in-out infinite;}
.exit-candle{position:absolute;width:9px;height:9px;border-radius:50%;
  transform:translate(-50%,-50%);top:50%;left:50%;pointer-events:none;z-index:8;}
.exit-candle.red{background:radial-gradient(circle,#ff6b5b,var(--red));
  box-shadow:0 0 5px 2px rgba(192,57,43,0.9),0 0 16px 6px rgba(192,57,43,0.3);
  animation:flicker-r 2.5s ease-in-out infinite;}
.exit-candle.green{background:radial-gradient(circle,#5bf58a,var(--green));
  box-shadow:0 0 5px 2px rgba(39,174,96,0.9),0 0 16px 6px rgba(39,174,96,0.3);
  animation:flicker-g 2.8s ease-in-out infinite;}

/* Spool token */
#spool-token{position:absolute;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#f0a0ff,var(--purple) 50%,#8800cc 100%);
  box-shadow:0 0 8px 3px rgba(204,68,255,0.8),0 0 20px 8px rgba(204,68,255,0.3);
  transform:translate(-50%,-50%);pointer-events:none;z-index:8;
  animation:spool-pulse 2s ease-in-out infinite;}
@keyframes spool-pulse{
  0%,100%{box-shadow:0 0 8px 3px rgba(204,68,255,0.8),0 0 20px 8px rgba(204,68,255,0.3);}
  50%{box-shadow:0 0 12px 5px rgba(204,68,255,1),0 0 30px 12px rgba(204,68,255,0.5);}
}
#spool-token.picked{display:none;}

/* Player token */
#player-token{position:absolute;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffe8a0,var(--yellow) 50%,var(--yellow-dim) 100%);
  box-shadow:0 0 7px 3px rgba(245,200,66,0.65),0 0 18px 6px rgba(245,200,66,0.25),0 0 44px 13px rgba(245,200,66,0.08);
  transform:translate(-50%,-50%);transition:left 0.15s ease,top 0.15s ease;
  pointer-events:none;z-index:10;animation:flicker-y 3s ease-in-out infinite;}
#player-token::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  width:4px;height:9px;background:linear-gradient(to top,var(--yellow),rgba(255,200,50,0.2),transparent);
  border-radius:50% 50% 30% 30%;animation:flame 0.75s ease-in-out infinite alternate;}
#player-token.candle-out{background:#181008;box-shadow:0 0 3px 1px rgba(40,20,5,0.3);animation:none;}
#player-token.candle-out::after{display:none;}

/* Monster token */
#monster-token{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);
  transition:left 0.2s ease,top 0.2s ease;pointer-events:none;z-index:9;display:none;}
#monster-token svg{width:100%;height:100%;}
#monster-token.chasing{animation:mpulse 0.55s ease-in-out infinite alternate;}
#monster-token.force-visible{display:block!important;}
@keyframes mpulse{
  from{filter:drop-shadow(0 0 3px rgba(180,30,30,0.6));}
  to{filter:drop-shadow(0 0 9px rgba(220,50,50,1));}}

/* Alter-ego token */
#altego-token{
  position:absolute;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#d0b8f0,#8040c0 50%,#5020a0 100%);
  box-shadow:0 0 7px 3px rgba(160,80,255,0.65),0 0 18px 6px rgba(160,80,255,0.25);
  transform:translate(-50%,-50%);transition:left 0.15s ease,top 0.15s ease;
  pointer-events:none;z-index:10;display:none;animation:flicker-alt 3.2s ease-in-out infinite;}
#altego-token::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  width:4px;height:9px;background:linear-gradient(to top,#a060ff,rgba(160,80,255,0.2),transparent);
  border-radius:50% 50% 30% 30%;animation:flame-alt 0.85s ease-in-out infinite alternate;}
#altego-token.candle-out{background:#120818;box-shadow:0 0 3px 1px rgba(60,10,80,0.3);animation:none;}
#altego-token.candle-out::after{display:none;}

/* Keyframes */
@keyframes flicker-y{
  0%,100%{box-shadow:0 0 7px 3px rgba(245,200,66,0.65),0 0 18px 6px rgba(245,200,66,0.25),0 0 44px 13px rgba(245,200,66,0.08);}
  35%{box-shadow:0 0 5px 2px rgba(245,200,66,0.5),0 0 13px 4px rgba(245,200,66,0.18),0 0 34px 10px rgba(245,200,66,0.05);}
  65%{box-shadow:0 0 9px 4px rgba(245,200,66,0.75),0 0 22px 8px rgba(245,200,66,0.3),0 0 54px 16px rgba(245,200,66,0.1);}}
@keyframes flame{from{height:7px;opacity:0.9;}to{height:12px;opacity:0.5;transform:translateX(-47%) skewX(6deg);}}
@keyframes flicker-r{0%,100%{opacity:1;}40%{opacity:0.7;}70%{opacity:0.88;}}
@keyframes flicker-g{0%,100%{opacity:1;}30%{opacity:0.76;}65%{opacity:0.92;}}
@keyframes flicker-alt{
  0%,100%{box-shadow:0 0 7px 3px rgba(160,80,255,0.65),0 0 18px 6px rgba(160,80,255,0.25);}
  35%{box-shadow:0 0 5px 2px rgba(160,80,255,0.5),0 0 13px 4px rgba(160,80,255,0.18);}
  65%{box-shadow:0 0 9px 4px rgba(160,80,255,0.75),0 0 22px 8px rgba(160,80,255,0.3);}}
@keyframes flame-alt{from{height:7px;opacity:0.9;}to{height:11px;opacity:0.5;}}

/* Status bar */
#status-bar{font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.22em;
  color:var(--text-bright);opacity:0.7;text-align:center;height:16px;}
#status-bar.danger{color:#e03030;opacity:1;animation:dblink 0.75s ease-in-out infinite alternate;}
#status-bar.chase{color:#e06010;opacity:1;}
#status-bar.thread-warn{color:var(--purple);opacity:1;}
@keyframes dblink{from{opacity:0.55;}to{opacity:1;}}

/* Controls hint */
#controls-hint{font-size:10px;letter-spacing:0.18em;color:var(--text-bright);
  opacity:0.5;text-align:center;font-family:'Cinzel',serif;}

/* Rune button */
#rune-btn{background:none;border:1px solid rgba(140,80,200,0.65);color:#d0a8ff;
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;
  padding:7px 18px;cursor:pointer;transition:border-color .2s,color .2s,box-shadow .2s;
  margin-top:4px;text-shadow:0 0 10px rgba(180,100,255,0.5);}
#rune-btn:not(:disabled):hover{border-color:#d090ff;color:#f0c8ff;
  box-shadow:0 0 20px rgba(180,80,255,0.4);text-shadow:0 0 14px rgba(200,120,255,0.8);}
#rune-btn:disabled{opacity:0.2;cursor:default;border-color:rgba(60,40,80,0.2);color:#3a2a4a;text-shadow:none;}

/* Exit cell highlights */
.cell.player-target-exit{outline:2px solid var(--yellow);outline-offset:-2px;}
.cell.arbiter-blocked-exit{outline:2px solid rgba(80,40,40,0.7);outline-offset:-2px;}
.cell.arbiter-blocked-exit .exit-candle{filter:grayscale(1) brightness(0.3);}
.cell.altlit{background:#09070d!important;}
.cell.altlit .corridor{background:#09070d;}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(5,5,5,0.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.55s ease;}
#overlay.active{opacity:1;pointer-events:all;}
#overlay-title{font-family:'Cinzel',serif;font-size:26px;letter-spacing:0.3em;
  text-transform:uppercase;color:var(--text-bright);}
#overlay-sub{font-family:'IM Fell English',serif;font-size:14px;letter-spacing:0.14em;
  opacity:0.65;color:var(--text-bright);}
.overlay-btn{background:none;border:1px solid rgba(180,130,80,0.45);color:var(--text-bright);
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.4em;text-transform:uppercase;
  padding:11px 30px;cursor:pointer;transition:border-color .2s,color .2s,box-shadow .2s;}
.overlay-btn:hover{border-color:var(--yellow-dim);color:var(--yellow);box-shadow:0 0 18px rgba(245,200,66,0.12);}
#overlay.win-left #overlay-title{color:var(--red);text-shadow:0 0 28px var(--red-glow);}
#overlay.win-right #overlay-title{color:var(--green);text-shadow:0 0 28px var(--green-glow);}
#overlay.start #overlay-title{color:var(--yellow-dim);text-shadow:0 0 26px rgba(245,200,66,0.25);}
#overlay.death #overlay-title{color:#6a1010;text-shadow:0 0 30px rgba(80,10,10,0.9);}
#overlay.death #overlay-sub{color:#7a3030;}
.overlay-btn-row{display:flex;gap:16px;}

@keyframes bump{
  0%{transform:translate(0,0) translate(-50%,-50%);}
  30%{transform:var(--bd) translate(-50%,-50%);}
  100%{transform:translate(0,0) translate(-50%,-50%);}}
.bump{animation:bump 0.14s ease;}
</style>
</head>
<body>

<div id="maze-root">
  <div id="maze-title-bar">The Labyrinth</div>
  <div id="hud">
    <div class="hud-candle red"><div class="candle-dot red"></div>Циничная</div>
    <div id="candle-status">свеча горит</div>
    <div id="steps-counter">Шагов: 0</div>
    <div id="thread-counter" class="inactive">Нить: —</div>
    <div id="candle-status-right" style="display:none"></div>
    <div class="hud-candle green"><div class="candle-dot green"></div>Наивная</div>
  </div>
  <div id="game-container">
    <canvas id="thread-canvas"></canvas>
    <div id="grid"></div>
    <div id="spool-token"></div>
    <div id="player-token"></div>
    <div id="altego-token"></div>
    <div id="monster-token">
      <svg viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="14" rx="7.5" ry="8.5" fill="#140606"/>
        <ellipse cx="12" cy="14" rx="7.5" ry="8.5" fill="none" stroke="#7a1212" stroke-width="1.2"/>
        <ellipse cx="9" cy="12" rx="2" ry="2.4" fill="#bb1e1e" opacity="0.92"/>
        <ellipse cx="15" cy="12" rx="2" ry="2.4" fill="#bb1e1e" opacity="0.92"/>
        <ellipse cx="9" cy="12.3" rx="0.8" ry="1" fill="#ff3333"/>
        <ellipse cx="15" cy="12.3" rx="0.8" ry="1" fill="#ff3333"/>
        <path d="M8.5 17.5 Q12 15.5 15.5 17.5" stroke="#7a1212" stroke-width="0.9" fill="none"/>
        <path d="M4.5 5 Q6.5 2 8.5 5 Q10 2.5 12 5 Q14 2.5 15.5 5 Q17.5 2 19.5 5" stroke="#4a0808" stroke-width="1.1" fill="none"/>
      </svg>
    </div>
  </div>
  <div id="status-bar"></div>
  <div id="controls-hint">W A S D — движение &nbsp;|&nbsp; E — взять / отпустить нить &nbsp;|&nbsp; R — руна отпугивания</div>
  <button id="rune-btn" disabled onclick="activateRune()">ᚦ Руна отпугивания &nbsp;[R]</button>
</div>

<div id="overlay">
  <div id="overlay-title"></div>
  <div id="overlay-sub"></div>
  <div id="overlay-btns" class="overlay-btn-row"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const Nd=0,Sd=1,Wd=2,Ed=3;
const ROWS=9, COLS=13, CELL_SIZE=58;
const EXIT_R=4, EXIT_L_C=0, EXIT_R_C=COLS-1;
const START_R=4, START_C=Math.floor(COLS/2);
const ARBITER_P_R=0, ARBITER_P_C=Math.floor(COLS/2);
const ARBITER_ALT_R=8, ARBITER_ALT_C=Math.floor(COLS/2);

// ═══════════════════════════════════════════════════════════
// MAZE GENERATION — improved with guaranteed long corridors
// ═══════════════════════════════════════════════════════════
function generateMaze(){
  const m=[];
  for(let r=0;r<ROWS;r++){m[r]=[];for(let c=0;c<COLS;c++)m[r][c]=[0,0,0,0];}
  const vis=Array.from({length:ROWS},()=>new Array(COLS).fill(false));
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

  // Recursive backtracker with bias toward longer corridors
  const stack=[[START_R,START_C]];
  vis[START_R][START_C]=true;
  let straightStreak=0;
  let lastDir=null;

  while(stack.length){
    const[r,c]=stack[stack.length-1];
    let dirs=sh([[Nd,-1,0],[Sd,1,0],[Wd,0,-1],[Ed,0,1]]);
    // bias: continue straight with 60% chance if possible
    if(lastDir!==null && straightStreak<4 && Math.random()<0.6){
      const preferred=dirs.find(d=>d[0]===lastDir);
      if(preferred){dirs=[preferred,...dirs.filter(d=>d!==preferred)];}
    }
    let moved=false;
    for(const[dir,dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS||vis[nr][nc])continue;
      m[r][c][dir]=1;m[nr][nc][[Sd,Nd,Ed,Wd][dir]]=1;
      vis[nr][nc]=true;stack.push([nr,nc]);
      if(dir===lastDir)straightStreak++;else{straightStreak=0;lastDir=dir;}
      moved=true;break;
    }
    if(!moved){stack.pop();lastDir=null;straightStreak=0;}
  }

  // Open exits
  m[EXIT_R][EXIT_L_C][Wd]=1;
  m[EXIT_R][EXIT_R_C][Ed]=1;
  return m;
}

// BFS distance
function bfsDist(maze,fr,fc,tr,tc){
  if(fr===tr&&fc===tc)return 0;
  const vis=new Set([`${fr},${fc}`]);
  const q=[{r:fr,c:fc,d:0}];
  while(q.length){
    const{r,c,d}=q.shift();
    for(const[dir,dr,dc]of[[Nd,-1,0],[Sd,1,0],[Wd,0,-1],[Ed,0,1]]){
      if(!maze[r][c][dir])continue;
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS)continue;
      const key=`${nr},${nc}`;if(vis.has(key))continue;
      vis.add(key);if(nr===tr&&nc===tc)return d+1;
      q.push({r:nr,c:nc,d:d+1});
    }
  }return 9999;
}

// BFS step
function bfsStep(maze,fr,fc,tr,tc){
  if(fr===tr&&fc===tc)return null;
  const vis=new Set([`${fr},${fc}`]);
  const q=[{r:fr,c:fc,first:null}];
  while(q.length){
    const{r,c,first}=q.shift();
    for(const[dir,dr,dc]of[[Nd,-1,0],[Sd,1,0],[Wd,0,-1],[Ed,0,1]]){
      if(!maze[r][c][dir])continue;
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS)continue;
      if(!maze[nr][nc][[Sd,Nd,Ed,Wd][dir]])continue;
      const key=`${nr},${nc}`;if(vis.has(key))continue;
      vis.add(key);const step=first||{r:nr,c:nc};
      if(nr===tr&&nc===tc)return step;
      q.push({r:nr,c:nc,first:step});
    }
  }return null;
}

// ═══════════════════════════════════════════════════════════
// SPOOL PLACEMENT — equidistant from both exits
// ═══════════════════════════════════════════════════════════
function findSpoolPosition(maze){
  const candidates=[];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(r===EXIT_R&&(c===EXIT_L_C||c===EXIT_R_C))continue;
      if(r===START_R&&c===START_C)continue;
      const dL=bfsDist(maze,r,c,EXIT_R,EXIT_L_C);
      const dR=bfsDist(maze,r,c,EXIT_R,EXIT_R_C);
      if(dL===9999||dR===9999)continue;
      candidates.push({r,c,dL,dR,diff:Math.abs(dL-dR)});
    }
  }
  // Sort by smallest diff (closest to equidistant), filter out start
  candidates.sort((a,b)=>a.diff-b.diff);
  const pool=candidates.slice(0,Math.max(1,Math.floor(candidates.length*0.15)));
  // pick randomly from the equidistant pool
  return pool[Math.floor(Math.random()*pool.length)];
}

function computeThreadLength(maze,spoolR,spoolC){
  const dL=bfsDist(maze,spoolR,spoolC,EXIT_R,EXIT_L_C);
  const dR=bfsDist(maze,spoolR,spoolC,EXIT_R,EXIT_R_C);
  const shortest=Math.min(dL,dR);
  return shortest+3; // 3 steps longer than shortest exit
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let MAZE=generateMaze();
let pR=START_R, pC=START_C, steps=0, gameActive=false, candleLit=true;
let mR=-1, mC=-1;
// Monster AI state
let mMode='idle'; // 'idle'|'chasing'|'scan'
let mLastSeenR=-1, mLastSeenC=-1; // last known player position
let mScanCooldown=0; // turns to wait before scanning again
let runeAvailable=true;
// Arbiter mode
let isArbiterMode=false;
let playerChoice='naive';
let altR=ARBITER_ALT_R, altC=ARBITER_ALT_C, altCandleLit=true;
let altPrevR=ARBITER_ALT_R, altPrevC=ARBITER_ALT_C;
let pPrevR=START_R, pPrevC=START_C;
// Thread / spool state
let spoolR=-1, spoolC=-1;
let threadLength=0;
let threadMaxLength=0;
let threadPath=[]; // array of {r,c} from spool to player
let hasThread=false;
let spoolPicked=false;
let threadConnected=false; // thread must reach exit to win

// Candle positions
let SC_POSITIONS=[], scLit={};

// ═══════════════════════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════════════════════
const gridEl=document.getElementById('grid');
const playerTok=document.getElementById('player-token');
const monsterTok=document.getElementById('monster-token');
const stepsEl=document.getElementById('steps-counter');
const candleSt=document.getElementById('candle-status');
const statusBar=document.getElementById('status-bar');
const overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlay-title');
const overlaySub=document.getElementById('overlay-sub');
const overlayBtns=document.getElementById('overlay-btns');
const runeBtnEl=document.getElementById('rune-btn');
const altegoTok=document.getElementById('altego-token');
const spoolTok=document.getElementById('spool-token');

const threadCtx=threadCanvas.getContext('2d');
const threadCounterEl=document.getElementById('thread-counter');
const cellEls=[];

// ═══════════════════════════════════════════════════════════
// CANDLES
// ═══════════════════════════════════════════════════════════
function findDeadEnds(maze){
  const forbidden=new Set([`${START_R},${START_C}`,`${EXIT_R},${EXIT_L_C}`,`${EXIT_R},${EXIT_R_C}`]);
  const dead=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(forbidden.has(`${r},${c}`))continue;
    const open=maze[r][c][Nd]+maze[r][c][Sd]+maze[r][c][Wd]+maze[r][c][Ed];
    if(open===1)dead.push([r,c]);
  }
  return dead;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function initCandles(){
  const dead=shuffle(findDeadEnds(MAZE));
  SC_POSITIONS=dead.slice(0,Math.min(4,dead.length));
  scLit={};SC_POSITIONS.forEach(([r,c])=>{scLit[`${r},${c}`]=false;});
}

// ═══════════════════════════════════════════════════════════
// GRID BUILD
// ═══════════════════════════════════════════════════════════
function buildGrid(){
  gridEl.innerHTML='';cellEls.length=0;
  // Size canvas
  threadCanvas.width=COLS*CELL_SIZE;
  threadCanvas.height=ROWS*CELL_SIZE;

  for(let r=0;r<ROWS;r++){
    cellEls[r]=[];
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');cell.className='cell dark';
      const corr=document.createElement('div');corr.className='corridor';
      const[cn,cs,cw,ce]=MAZE[r][c];
      if(!cn)corr.classList.add('wall-n');if(!cs)corr.classList.add('wall-s');
      if(!cw)corr.classList.add('wall-w');if(!ce)corr.classList.add('wall-e');
      cell.appendChild(corr);
      if(r===EXIT_R&&c===EXIT_L_C){const x=document.createElement('div');x.className='exit-candle red';cell.appendChild(x);}
      if(r===EXIT_R&&c===EXIT_R_C){const x=document.createElement('div');x.className='exit-candle green';cell.appendChild(x);}
      if(scLit.hasOwnProperty(`${r},${c}`)){
        const sc=document.createElement('div');sc.className='static-candle unlit';sc.id=`sc-${r}-${c}`;cell.appendChild(sc);
      }
      gridEl.appendChild(cell);cellEls[r][c]=cell;
    }
  }
}

// ═══════════════════════════════════════════════════════════
// LIGHTING
// ═══════════════════════════════════════════════════════════
function los(r1,c1,r2,c2){
  if(r1===r2&&c1===c2)return true;
  if(r1!==r2&&c1!==c2)return false;
  if(r1===r2){
    const mn=Math.min(c1,c2),mx=Math.max(c1,c2);
    for(let c=mn;c<mx;c++)if(!MAZE[r1][c][Ed]||!MAZE[r1][c+1][Wd])return false;
    return true;
  }else{
    const mn=Math.min(r1,r2),mx=Math.max(r1,r2);
    for(let r=mn;r<mx;r++)if(!MAZE[r][c1][Sd]||!MAZE[r+1][c1][Nd])return false;
    return true;
  }
}

function getLitSet(){
  const lit=new Set([`${pR},${pC}`]);
  if(candleLit){
    [[Nd,-1,0],[Sd,1,0],[Wd,0,-1],[Ed,0,1]].forEach(([dir,dr,dc])=>{
      if(!MAZE[pR][pC][dir])return;
      const nr=pR+dr,nc=pC+dc;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return;
      if(!MAZE[nr][nc][[Sd,Nd,Ed,Wd][dir]])return;
      lit.add(`${nr},${nc}`);
    });
  }
  SC_POSITIONS.forEach(([r,c])=>{if(scLit[`${r},${c}`])lit.add(`${r},${c}`);});
  return lit;
}

function getAltLitSet(){
  const lit=new Set([`${altR},${altC}`]);
  if(altCandleLit){
    [[Nd,-1,0],[Sd,1,0],[Wd,0,-1],[Ed,0,1]].forEach(([dir,dr,dc])=>{
      if(!MAZE[altR][altC][dir])return;
      const nr=altR+dr,nc=altC+dc;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return;
      if(!MAZE[nr][nc][[Sd,Nd,Ed,Wd][dir]])return;
      lit.add(`${nr},${nc}`);
    });
  }
  return lit;
}

function updateLighting(){
  const lit=getLitSet();
  const altLit=isArbiterMode?getAltLitSet():new Set();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const el=cellEls[r][c];const key=`${r},${c}`;
    el.classList.remove('lit','player-cell','exit-left','exit-right','static-lit','altlit','spool-glow');
    const inPlayerLit=lit.has(key);
    const inAltLit=altLit.has(key);
    if(inPlayerLit||inAltLit){
      el.classList.remove('dark');
      el.classList.add(inPlayerLit?'lit':'altlit');
      if(r===pR&&c===pC)el.classList.add('player-cell');
      if(r===EXIT_R&&c===EXIT_L_C)el.classList.add('exit-left');
      if(r===EXIT_R&&c===EXIT_R_C)el.classList.add('exit-right');
      if(scLit[key])el.classList.add('static-lit');
      // Spool glow when player is adjacent or on it
      if(!spoolPicked&&r===spoolR&&c===spoolC&&(inPlayerLit||(pR===r&&pC===c)))
        el.classList.add('spool-glow');
    }else{el.classList.add('dark');}
  }
  SC_POSITIONS.forEach(([r,c])=>{
    const sc=document.getElementById(`sc-${r}-${c}`);
    if(sc)sc.className='static-candle '+(scLit[`${r},${c}`]?'lit-yellow':'unlit');
  });
  playerTok.classList.toggle('candle-out',!candleLit);
  if(isArbiterMode) altegoTok.classList.toggle('candle-out',!altCandleLit);
  candleSt.textContent=candleLit?'свеча горит':'свеча погашена';
  candleSt.className=candleLit?'':'out';
}

// ═══════════════════════════════════════════════════════════
// THREAD SYSTEM
// ═══════════════════════════════════════════════════════════
function updateThreadCounter(){
  if(!spoolPicked){
    threadCounterEl.textContent='Нить: —';
    threadCounterEl.className='inactive';
    return;
  }
  if(!hasThread){
    threadCounterEl.textContent='Нить: не взята [E]';
    threadCounterEl.className='inactive';
    return;
  }
  const remaining=threadMaxLength-threadLength;
  threadCounterEl.textContent=`Нить: ${remaining} / ${threadMaxLength}`;
  threadCounterEl.className=remaining<=3?'danger':'';
}

// Rebuild thread path from spool to current player position step by step
// threadPath is maintained incrementally in tryMove
function drawThread(){
  threadCtx.clearRect(0,0,threadCanvas.width,threadCanvas.height);
  if(!hasThread||threadPath.length<2)return;
  threadCtx.beginPath();
  threadCtx.strokeStyle='rgba(200,80,255,0.75)';
  threadCtx.lineWidth=2;
  threadCtx.lineCap='round';
  threadCtx.lineJoin='round';
  const cs=CELL_SIZE;
  threadCtx.moveTo(threadPath[0].c*cs+cs/2, threadPath[0].r*cs+cs/2);
  for(let i=1;i<threadPath.length;i++){
    threadCtx.lineTo(threadPath[i].c*cs+cs/2, threadPath[i].r*cs+cs/2);
  }
  threadCtx.stroke();

  // Draw spool node
  const sx=spoolR*cs+cs/2, sy=spoolC*cs+cs/2; // note: swapped intentionally — use correct coords:
  const spx=spoolC*cs+cs/2, spy=spoolR*cs+cs/2;
  threadCtx.beginPath();
  threadCtx.arc(spx,spy,4,0,Math.PI*2);
  threadCtx.fillStyle='rgba(200,80,255,0.9)';
  threadCtx.fill();
}

// ═══════════════════════════════════════════════════════════
// SPOOL TOKEN
// ═══════════════════════════════════════════════════════════
function updateSpoolToken(){
  if(spoolPicked){spoolTok.style.display='none';return;}
  spoolTok.style.display='block';
  spoolTok.style.left=(spoolC*CELL_SIZE+CELL_SIZE/2)+'px';
  spoolTok.style.top=(spoolR*CELL_SIZE+CELL_SIZE/2)+'px';
}

// ═══════════════════════════════════════════════════════════
// MONSTER AI — orthogonal LOS + last-seen-point pursuit
// ═══════════════════════════════════════════════════════════
function monsterScanForPlayer(){
  // Scan all 4 orthogonal directions for line of sight to player
  return los(mR,mC,pR,pC);
}

function renderMonster(){
  if(mR<0){monsterTok.style.display='none';monsterTok.classList.remove('force-visible','chasing');return;}
  const lit=getLitSet();
  const vis=lit.has(`${mR},${mC}`);
  const chasing=(mMode==='chasing'||mMode==='scan');
  if(vis||chasing){
    monsterTok.style.display='block';
    monsterTok.style.left=(mC*CELL_SIZE+CELL_SIZE/2)+'px';
    monsterTok.style.top=(mR*CELL_SIZE+CELL_SIZE/2)+'px';
    monsterTok.classList.toggle('chasing', chasing);
    monsterTok.classList.toggle('force-visible', chasing&&!vis);
  }else{
    monsterTok.style.display='none';
    monsterTok.classList.remove('force-visible','chasing');
  }
}

function moveMonsterToward(tr,tc){
  const s=bfsStep(MAZE,mR,mC,tr,tc);
  if(s){mR=s.r;mC=s.c;}
}

function spawnMonster(){
  const forbidden=new Set([`${pR},${pC}`,`${EXIT_R},${EXIT_L_C}`,`${EXIT_R},${EXIT_R_C}`]);
  if(isArbiterMode) forbidden.add(`${altR},${altC}`);
  SC_POSITIONS.forEach(([r,c])=>forbidden.add(`${r},${c}`));
  if(spoolR>=0) forbidden.add(`${spoolR},${spoolC}`);
  const cands=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!forbidden.has(`${r},${c}`)&&!los(r,c,pR,pC))cands.push([r,c]);
  }
  const pool=cands.length?cands:[[0,0]];
  const[r,c]=pool[Math.floor(Math.random()*pool.length)];
  mR=r;mC=c;mMode='idle';mLastSeenR=-1;mLastSeenC=-1;mScanCooldown=0;
}

function monsterTurn(){
  if(mR<0)return;

  // In arbiter mode choose nearest target
  let tR=pR,tC=pC;
  if(isArbiterMode){
    const dp=bfsDist(MAZE,mR,mC,pR,pC);
    const da=bfsDist(MAZE,mR,mC,altR,altC);
    if(da<dp){tR=altR;tC=altC;}
  }

  const canSeePlayer=los(mR,mC,tR,tC);

  if(mMode==='idle'){
    if(canSeePlayer){
      mLastSeenR=tR;mLastSeenC=tC;
      mMode='chasing';
      // Extinguish candle on sight
      if(candleLit) candleLit=false;
      if(isArbiterMode&&tR===altR&&altCandleLit) altCandleLit=false;
    }
    return;
  }

  if(mMode==='chasing'){
    if(canSeePlayer){
      // Update last seen
      mLastSeenR=tR;mLastSeenC=tC;
      if(candleLit) candleLit=false;
      if(isArbiterMode&&tR===altR&&altCandleLit) altCandleLit=false;
      moveMonsterToward(tR,tC);
    }else{
      // Lost sight — move toward last known position
      if(mR===mLastSeenR&&mC===mLastSeenC){
        // Arrived at last seen point — rescan
        mMode='scan';
        mScanCooldown=1; // one idle turn to scan
      }else{
        moveMonsterToward(mLastSeenR,mLastSeenC);
        // Check again after move
        if(mR===mLastSeenR&&mC===mLastSeenC){
          mMode='scan';mScanCooldown=1;
        }
      }
    }
    return;
  }

  if(mMode==='scan'){
    if(mScanCooldown>0){mScanCooldown--;return;} // wait one turn
    // Now scan orthogonal corridors
    if(los(mR,mC,tR,tC)){
      // Spotted again
      mLastSeenR=tR;mLastSeenC=tC;
      mMode='chasing';
      if(candleLit) candleLit=false;
      moveMonsterToward(tR,tC);
    }else{
      // Lost for good — return to idle after a moment, then respawn
      mR=-1;mC=-1;mMode='idle';
      setTimeout(()=>{if(!gameActive)return;spawnMonster();renderMonster();updateRuneBtn();},700);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// STATUS / TOKENS
// ═══════════════════════════════════════════════════════════
function updateStatus(){
  if(!gameActive){statusBar.textContent='';statusBar.className='';return;}
  const monVisible=mR>=0&&getLitSet().has(`${mR},${mC}`);
  if(mMode==='chasing'&&monVisible){
    statusBar.textContent='ПРЕСЛЕДОВАНИЕ';statusBar.className='danger';
  }else if(mMode==='chasing'){
    statusBar.textContent='ОНО ИЩЕТ ТЕБЯ';statusBar.className='chase';
  }else if(mMode==='scan'){
    statusBar.textContent='ОНО ПРИСЛУШИВАЕТСЯ';statusBar.className='chase';
  }else if(!candleLit){
    statusBar.textContent='свеча погашена — найди огонь в тупике';statusBar.className='';
  }else if(hasThread&&threadLength>=threadMaxLength-2){
    statusBar.textContent='НИТЬ НАТЯНУТА';statusBar.className='thread-warn';
  }else{
    statusBar.textContent='';statusBar.className='';
  }
}

function updatePlayerToken(){
  playerTok.style.left=(pC*CELL_SIZE+CELL_SIZE/2)+'px';
  playerTok.style.top=(pR*CELL_SIZE+CELL_SIZE/2)+'px';
  if(isArbiterMode){
    altegoTok.style.display='block';
    altegoTok.style.left=(altC*CELL_SIZE+CELL_SIZE/2)+'px';
    altegoTok.style.top=(altR*CELL_SIZE+CELL_SIZE/2)+'px';
  }else{
    altegoTok.style.display='none';
  }
}

function markPlayerTargetExit(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    cellEls[r][c].classList.remove('player-target-exit','arbiter-blocked-exit');
  }
  if(!isArbiterMode)return;
  const targetC=playerChoice==='cynic'?EXIT_L_C:EXIT_R_C;
  const blockedC=playerChoice==='cynic'?EXIT_R_C:EXIT_L_C;
  cellEls[EXIT_R][targetC].classList.add('player-target-exit');
  cellEls[EXIT_R][blockedC].classList.add('arbiter-blocked-exit');
}

// ═══════════════════════════════════════════════════════════
// RUNE
// ═══════════════════════════════════════════════════════════
function updateRuneBtn(){
  if(!runeAvailable){runeBtnEl.disabled=true;runeBtnEl.textContent='ᚦ Руна использована';return;}
  const monInFov=mR>=0&&getLitSet().has(`${mR},${mC}`);
  const monForced=mR>=0&&(mMode==='chasing'||mMode==='scan');
  runeBtnEl.disabled=!(monInFov||monForced)||!gameActive;
  if(runeAvailable&&runeBtnEl.disabled===false)
    runeBtnEl.textContent='ᚦ Руна отпугивания [R]';
}

function activateRune(){
  if(!runeAvailable||!gameActive)return;
  if(mR<0)return;
  const monInFov=getLitSet().has(`${mR},${mC}`);
  const monForced=mMode==='chasing'||mMode==='scan';
  if(!monInFov&&!monForced)return;
  runeAvailable=false;
  mR=-1;mC=-1;mMode='idle';mLastSeenR=-1;mLastSeenC=-1;mScanCooldown=0;
  monsterTok.classList.remove('force-visible','chasing');monsterTok.style.display='none';
  setTimeout(()=>{if(!gameActive)return;spawnMonster();renderMonster();},800);
  updateLighting();updateRuneBtn();updateStatus();
}

// ═══════════════════════════════════════════════════════════
// ARBITER MODE
// ═══════════════════════════════════════════════════════════
function altEgoTurn(){
  const altTarget=playerChoice==='cynic'?{r:EXIT_R,c:EXIT_R_C}:{r:EXIT_R,c:EXIT_L_C};
  if(altR===EXIT_R&&altC===EXIT_R_C&&playerChoice==='cynic'){triggerAltWin();return;}
  if(altR===EXIT_R&&altC===EXIT_L_C&&playerChoice==='naive'){triggerAltWin();return;}
  const s=bfsStep(MAZE,altR,altC,altTarget.r,altTarget.c);
  if(s){altPrevR=altR;altPrevC=altC;altR=s.r;altC=s.c;}
  const scKey=`${altR},${altC}`;
  if(scLit.hasOwnProperty(scKey)){
    if(!scLit[scKey]&&altCandleLit)scLit[scKey]=true;
    if(scLit[scKey]&&!altCandleLit)altCandleLit=true;
  }
  if(altR===EXIT_R&&altC===EXIT_R_C&&playerChoice==='cynic'){triggerAltWin();return;}
  if(altR===EXIT_R&&altC===EXIT_L_C&&playerChoice==='naive'){triggerAltWin();return;}
}

function checkArbiterCollision(){
  const dist=bfsDist(MAZE,pR,pC,altR,altC);
  if(dist<=1){
    pR=ARBITER_P_R;pC=ARBITER_P_C;pPrevR=ARBITER_P_R;pPrevC=ARBITER_P_C;
    altR=ARBITER_ALT_R;altC=ARBITER_ALT_C;altPrevR=ARBITER_ALT_R;altPrevC=ARBITER_ALT_C;
    candleLit=true;altCandleLit=true;
  }
}

function checkArbiterMonsterContact(){
  if(mR<0)return false;
  let hit=false;
  if(pR===mR&&pC===mC){
    pR=ARBITER_P_R;pC=ARBITER_P_C;pPrevR=ARBITER_P_R;pPrevC=ARBITER_P_C;
    candleLit=true;hit=true;
  }
  if(altR===mR&&altC===mC){
    altR=ARBITER_ALT_R;altC=ARBITER_ALT_C;altPrevR=ARBITER_ALT_R;altPrevC=ARBITER_ALT_C;
    altCandleLit=true;hit=true;
  }
  return hit;
}

// ═══════════════════════════════════════════════════════════
// THREAD INTERACTION (E key)
// ═══════════════════════════════════════════════════════════
function interactThread(){
  if(!gameActive)return;
  if(!spoolPicked){
    // Pick up spool only when standing on it
    if(pR===spoolR&&pC===spoolC){
      spoolPicked=true;
      // Don't start thread yet — just indicate spool is picked
      updateSpoolToken();
      updateThreadCounter();
      statusBar.textContent='Нить готова — нажми E чтобы начать тянуть';
      statusBar.className='thread-warn';
    }
    return;
  }
  if(!hasThread){
    // Start pulling thread from spool position
    if(pR===spoolR&&pC===spoolC){
      hasThread=true;
      threadPath=[{r:spoolR,c:spoolC}];
      threadLength=0;
      updateThreadCounter();
      drawThread();
    }
    return;
  }
  // Drop thread
  hasThread=false;
  updateThreadCounter();
  drawThread();
  statusBar.textContent='Нить отпущена';
  statusBar.className='';
}

// ═══════════════════════════════════════════════════════════
// MOVE
// ═══════════════════════════════════════════════════════════
const DIR_MAP={'w':[Nd,-1,0],'s':[Sd,1,0],'a':[Wd,0,-1],'d':[Ed,0,1]};
const BUMP={'w':'translate(0,-5px)','s':'translate(0,5px)','a':'translate(-5px,0)','d':'translate(5px,0)'};

function tryMove(key){
  if(!gameActive)return;
  const k=key.toLowerCase();if(!DIR_MAP[k])return;
  const[dir,dr,dc]=DIR_MAP[k];
  const nr=pR+dr,nc=pC+dc;

  // Boundary exits
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS){
    if(pR===EXIT_R&&pC===EXIT_L_C&&k==='a'){
      if(isArbiterMode&&playerChoice!=='cynic'){bumpP(k);return;}
      // Thread check: must have thread connected to exit
      if(!threadConnectedCheck('left')){bumpP(k);return;}
      triggerWin('left');return;
    }
    if(pR===EXIT_R&&pC===EXIT_R_C&&k==='d'){
      if(isArbiterMode&&playerChoice!=='naive'){bumpP(k);return;}
      if(!threadConnectedCheck('right')){bumpP(k);return;}
      triggerWin('right');return;
    }
    bumpP(k);return;
  }

  if(!MAZE[pR][pC][dir]){bumpP(k);return;}
  if(!MAZE[nr][nc][[Sd,Nd,Ed,Wd][dir]]){bumpP(k);return;}
  if(candleLit&&!getLitSet().has(`${nr},${nc}`)){bumpP(k);return;}

  // Thread length constraint: prevent movement that extends thread beyond max
  if(hasThread){
    // Detect if this move is a retrace (going back to second-to-last cell in path)
    const lastPrev=threadPath.length>=2?threadPath[threadPath.length-2]:null;
    const isRetrace=lastPrev&&lastPrev.r===nr&&lastPrev.c===nc;
    // Only block if we would extend beyond max AND it's not a retrace
    if(!isRetrace&&threadPath.length>=threadMaxLength){
      bumpP(k);return;
    }
  }

  pPrevR=pR;pPrevC=pC;
  pR=nr;pC=nc;
  steps++;stepsEl.textContent='Шагов: '+steps;

  // Thread path update
  if(hasThread){
    // Check if retracing (stepping back to second-to-last path cell)
    const prevInPath=threadPath.length>=2&&threadPath[threadPath.length-2].r===nr&&threadPath[threadPath.length-2].c===nc;
    if(prevInPath){
      threadPath.pop(); // retrace: shorten thread
    }else{
      threadPath.push({r:nr,c:nc});
    }
    threadLength=Math.max(0,threadPath.length-1);
    drawThread();
    updateThreadCounter();
  }

  // Static candle interaction
  const scKey=`${pR},${pC}`;
  if(scLit.hasOwnProperty(scKey)){
    if(!scLit[scKey]&&candleLit)scLit[scKey]=true;
    if(scLit[scKey]&&!candleLit)candleLit=true;
  }

  // Spool proximity glow
  if(!spoolPicked&&pR===spoolR&&pC===spoolC){
    // On spool cell — glow handled in updateLighting
  }

  if(isArbiterMode) checkArbiterCollision();
  monsterTurn();
  if(isArbiterMode&&gameActive) altEgoTurn();
  if(isArbiterMode&&gameActive) checkArbiterCollision();

  updateLighting();updatePlayerToken();updateSpoolToken();renderMonster();updateStatus();updateRuneBtn();
  if(isArbiterMode) markPlayerTargetExit();

  if(isArbiterMode&&gameActive){
    if(checkArbiterMonsterContact()){updateLighting();updatePlayerToken();}
    return;
  }
  if(mR>=0&&pR===mR&&pC===mC){triggerDeath();return;}
}

function threadConnectedCheck(side){
  // Thread must be active and reach the exit cell to allow exiting
  if(!spoolPicked)return false;
  if(!hasThread)return false;
  // Thread path must include exit cell
  const exitC=side==='left'?EXIT_L_C:EXIT_R_C;
  // The player is on the exit cell already; the last point in path is current pos
  // so we just need thread to be present and length > 0
  return threadPath.length>=2;
}

function bumpP(k){
  playerTok.style.setProperty('--bd',BUMP[k]||'translate(0,0)');
  playerTok.classList.remove('bump');void playerTok.offsetWidth;playerTok.classList.add('bump');
}

// ═══════════════════════════════════════════════════════════
// WIN / DEATH
// ═══════════════════════════════════════════════════════════
function triggerWin(side){
  gameActive=false;
  const result=side==='left'?'cynic':'naive';
  if(isArbiterMode){
    const playerWon=result===playerChoice;
    const finalResult=playerWon?playerChoice:(playerChoice==='cynic'?'naive':'cynic');
    overlay.className='active '+(finalResult==='cynic'?'win-left':'win-right');
    overlayTitle.textContent=playerWon?'Ты первым':'Альтер-эго первым';
    overlaySub.textContent='Обе улики трактованы '+(finalResult==='cynic'?'цинично':'наивно');
    overlayBtns.innerHTML='';
    const btn=document.createElement('button');btn.className='overlay-btn';
    btn.textContent='Снова';btn.onclick=()=>{overlay.className='';overlay.classList.remove('active');startGame();};
    overlayBtns.appendChild(btn);return;
  }
  overlay.className='active '+(side==='left'?'win-left':'win-right');
  overlayTitle.textContent=side==='left'?'Красный Свет — Циничная':'Зелёный Свет — Наивная';
  overlaySub.textContent='Ты вышел из лабиринта. Шагов пройдено: '+steps;
  overlayBtns.innerHTML='';
  const btn=document.createElement('button');btn.className='overlay-btn';
  btn.textContent='Войти снова';btn.onclick=()=>{overlay.className='';overlay.classList.remove('active');startGame();};
  overlayBtns.appendChild(btn);
}

function triggerAltWin(){
  gameActive=false;
  const finalResult=playerChoice==='cynic'?'naive':'cynic';
  overlay.className='active '+(finalResult==='cynic'?'win-left':'win-right');
  overlayTitle.textContent='Альтер-эго победило';
  overlaySub.textContent='Обе улики трактованы '+(finalResult==='cynic'?'цинично':'наивно');
  overlayBtns.innerHTML='';
  const btn=document.createElement('button');btn.className='overlay-btn';
  btn.textContent='Снова';btn.onclick=()=>{overlay.className='';overlay.classList.remove('active');startGame();};
  overlayBtns.appendChild(btn);
}

function triggerDeath(){
  if(isArbiterMode)return;
  gameActive=false;
  overlay.className='active death';
  overlayTitle.textContent='Темнота';
  overlaySub.textContent='Ты встретил его в темноте. Шагов пройдено: '+steps;
  overlayBtns.innerHTML='';
  const btn=document.createElement('button');btn.className='overlay-btn';
  btn.textContent='Войти снова';btn.onclick=()=>{overlay.className='';overlay.classList.remove('active');startGame();};
  overlayBtns.appendChild(btn);
}

// ═══════════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════════
function startGame(){
  isArbiterMode=false;
  MAZE=generateMaze();initCandles();

  // Place spool
  const sp=findSpoolPosition(MAZE);
  spoolR=sp.r;spoolC=sp.c;
  threadMaxLength=computeThreadLength(MAZE,spoolR,spoolC);
  spoolPicked=false;hasThread=false;threadPath=[];threadLength=0;

  pR=START_R;pC=START_C;pPrevR=START_R;pPrevC=START_C;
  steps=0;candleLit=true;
  mR=-1;mC=-1;mMode='idle';mLastSeenR=-1;mLastSeenC=-1;mScanCooldown=0;
  runeAvailable=true;

  stepsEl.textContent='Шагов: 0';
  buildGrid();updateLighting();updatePlayerToken();updateSpoolToken();
  monsterTok.style.display='none';monsterTok.classList.remove('force-visible','chasing');
  altegoTok.style.display='none';
  statusBar.textContent='';statusBar.className='';
  runeBtnEl.textContent='ᚦ Руна отпугивания [R]';
  updateRuneBtn();
  updateThreadCounter();
  threadCtx.clearRect(0,0,threadCanvas.width,threadCanvas.height);

  overlay.className='active start';
  overlayTitle.textContent='The Labyrinth';
  overlaySub.textContent='Найди катушку. Протяни нить к выходу. Не смотри в глаза.';
  overlayBtns.innerHTML='';
  const btn=document.createElement('button');btn.className='overlay-btn';btn.textContent='Войти';
  btn.onclick=()=>{
    overlay.className='';overlay.classList.remove('active');
    gameActive=true;
    setTimeout(()=>{if(!gameActive)return;spawnMonster();renderMonster();},900);
  };
  overlayBtns.appendChild(btn);
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  switch(e.code){
    case 'KeyW':case 'ArrowUp':    e.preventDefault();tryMove('w');break;
    case 'KeyS':case 'ArrowDown':  e.preventDefault();tryMove('s');break;
    case 'KeyA':case 'ArrowLeft':  e.preventDefault();tryMove('a');break;
    case 'KeyD':case 'ArrowRight': e.preventDefault();tryMove('d');break;
    case 'KeyR': e.preventDefault();activateRune();break;
    case 'KeyE': e.preventDefault();interactThread();break;
  }
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
  tryMove(Math.abs(dx)>Math.abs(dy)?(dx>0?'d':'a'):(dy>0?'s':'w'));
},{passive:true});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
startGame();
</script>
